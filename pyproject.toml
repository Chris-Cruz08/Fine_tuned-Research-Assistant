[project]
name = "ai-research-qa-finetuned-model"
version = "0.1.0"
description = "QLoRA fine-tuned Qwen2.5-3B for AI/ML research paper Q&A (RAG answering brain)"
requires-python = ">=3.10,<3.12"
readme = "README.md"
dependencies = [
    "datasets>=2.19.0",
    "huggingface-hub>=0.23.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "mlflow>=2.13.0",
    "ragas>=0.1.9",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "scikit-learn>=1.4.0",
    "tqdm>=4.66.0",
]

# NOTE: torch / transformers / peft / bitsandbytes / accelerate / trl are
# intentionally NOT listed here for local install. This project trains
# in Colab (Linux + CUDA T4), and bitsandbytes 4-bit quantization does
# not reliably install/run on local Windows. Install the training stack
# via pip inside the Colab notebook (see notebooks/02_finetuning_qlora_colab.ipynb).
# Locally on Windows/PyCharm you only run: dataset prep, eval scripts against
# a served/downloaded model, and the hub push script.

[project.optional-dependencies]
local-cpu-eval = [
    "transformers>=4.42.0",
    "torch>=2.3.0",
]

[tool.uv]
package = false
